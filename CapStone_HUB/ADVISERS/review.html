<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Document | CapstoneHub</title>
<link rel="icon" type="image/png" href="../LOGO/logo0.1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>

  /* --- DESIGN TOKENS --- */
  :root {
    --color-white: #ffffff;
    --color-offwhite: #f8f9fa;
    --color-border: #e0e0e0;
    --color-text-primary: #202124;
    --color-text-secondary: #5f6368;
    --color-text-muted: #80868b;

    --blue: #4285F4;
    --red: #EA4335;
    --yellow: #FBBC05;
    --green: #34A853;

    --blue-tint: #e8f0fe;
    --red-tint: #fce8e6;
    --yellow-tint: #fef7e0;
    --green-tint: #e6f4ea;

    --topbar-height: 56px;
    --toolbar-height: 52px;
    --radius-sm: 4px;
    --radius-md: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Roboto', system-ui, -apple-system, sans-serif;
    color: var(--color-text-primary);
    background-color: var(--color-white);
    overflow: hidden;
    height: 100vh;
  }

  .hidden { display: none !important; }

  /* --- SLIM IDENTIFICATION BAR --- */
  .topbar {
    height: var(--topbar-height);
    background: var(--color-white);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .back-link {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--color-text-secondary);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    flex-shrink: 0;
  }
  .back-link:hover { color: var(--color-text-primary); }

  .topbar-divider {
    width: 1px;
    height: 20px;
    background: var(--color-border);
    flex-shrink: 0;
  }

  .brand-mark {
    width: 25px;
    height: 25px;
    object-fit: contain;
  }

  .brand-name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }

  .reviewing-label {
    font-size: 13.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .reviewing-label span {
    color: var(--color-text-muted);
    font-weight: 400;
  }

  .user-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--blue);
    color: var(--color-white);
    font-size: 12px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* --- TOOLBAR --- */
  .toolbar {
    height: var(--toolbar-height);
    background: var(--color-white);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .tool-group {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .tool-btn {
    width: 34px;
    height: 34px;
    border: none;
    background: none;
    border-radius: var(--radius-sm);
    color: var(--color-text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .tool-btn:hover { background: var(--color-offwhite); }
  .tool-btn.active { background: var(--blue-tint); color: var(--blue); }
  .tool-btn:disabled { opacity: 0.35; cursor: default; }
  .tool-btn:disabled:hover { background: none; }

  .toolbar-divider {
    width: 1px;
    height: 22px;
    background: var(--color-border);
    margin: 0 6px;
    flex-shrink: 0;
  }

  .color-swatch {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
  }
  .color-swatch.active { border-color: var(--color-text-primary); }

  .color-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .page-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .page-nav-label {
    font-size: 13px;
    color: var(--color-text-secondary);
    white-space: nowrap;
    min-width: 76px;
    text-align: center;
  }

  .toolbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    padding: 8px 16px;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .btn-outline-red {
    background: var(--color-white);
    border-color: var(--red);
    color: var(--red);
  }
  .btn-outline-red:hover { background: var(--red-tint); }

  .btn-solid-green {
    background: var(--green);
    color: var(--color-white);
  }
  .btn-solid-green:hover { background: #2d9349; }

  /* --- MAIN AREA --- */
  .main-area {
    display: flex;
    height: calc(100vh - var(--topbar-height) - var(--toolbar-height));
  }

  .canvas-area {
    flex: 1;
    background: var(--color-offwhite);
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    position: relative;
  }

  .page-stage {
    position: relative;
    background: var(--color-white);
    border: 1px solid var(--color-border);
    box-shadow: none;
    flex-shrink: 0;
  }

  .page-base {
    display: block;
  }

  .page-annotation-canvas {
    position: absolute;
    top: 0;
    left: 0;
  }
  .page-annotation-canvas.tool-select { cursor: default; }
  .page-annotation-canvas.tool-pen,
  .page-annotation-canvas.tool-rectangle,
  .page-annotation-canvas.tool-circle,
  .page-annotation-canvas.tool-arrow { cursor: crosshair; }
  .page-annotation-canvas.tool-text { cursor: text; }
  .page-annotation-canvas.tool-eraser { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><circle cx='12' cy='12' r='9' fill='none' stroke='%23202124' stroke-width='2'/></svg>") 12 12, pointer; }
  .page-annotation-canvas { touch-action: none; }

  .text-input-popup {
    position: absolute;
    background: var(--color-white);
    border: 1px solid var(--blue);
    border-radius: var(--radius-sm);
    padding: 6px;
    display: flex;
    gap: 6px;
    align-items: center;
    z-index: 20;
  }
  .text-input-popup input {
    font-family: inherit;
    font-size: 13px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
    outline: none;
    width: 180px;
  }
  .text-input-popup input:focus { border-color: var(--blue); }
  .text-input-popup button {
    border: none;
    background: var(--blue);
    color: var(--color-white);
    font-size: 12px;
    font-weight: 500;
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    cursor: pointer;
  }

  /* --- Right Sidebar --- */
  .review-sidebar {
    width: 220px;
    border-left: 1px solid var(--color-border);
    background: var(--color-white);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .sidebar-section {
    padding: 14px 14px 16px;
    border-bottom: 1px solid var(--color-border);
  }
  .sidebar-section:last-child { border-bottom: none; }

  .sidebar-section-title {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--color-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 10px;
  }

  .thumbnail-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .thumbnail {
    height: 58px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-offwhite);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--color-text-muted);
    position: relative;
    padding: 6px 10px;
  }
  .thumbnail:hover { border-color: #c0c0c0; }
  .thumbnail.active { border: 2px solid var(--blue); background: var(--blue-tint); }

  .thumbnail-dot {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--red);
  }

  .comments-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .comment-item {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    cursor: pointer;
    padding: 6px;
    border-radius: var(--radius-sm);
  }
  .comment-item:hover { background: var(--color-offwhite); }

  .comment-badge {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--red);
    color: var(--color-white);
    font-size: 10px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .comment-text-wrap { min-width: 0; }
  .comment-text {
    font-size: 12.5px;
    color: var(--color-text-primary);
    line-height: 1.4;
    word-break: break-word;
  }
  .comment-page {
    font-size: 11px;
    color: var(--color-text-muted);
    margin-top: 2px;
  }

  .comments-empty {
    font-size: 12px;
    color: var(--color-text-muted);
    line-height: 1.5;
  }

  /* --- Toast confirmation --- */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--color-text-primary);
    color: var(--color-white);
    font-size: 13.5px;
    padding: 12px 20px;
    border-radius: var(--radius-md);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 100;
  }
  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* --- Responsive --- */
  @media (max-width: 900px) {
    .review-sidebar { display: none; }
    .reviewing-label { max-width: 140px; }
  }
  @media (max-width: 640px) {
    .toolbar { gap: 8px; }
    .page-nav-label { min-width: 60px; font-size: 12px; }
    .btn { padding: 8px 12px; font-size: 12.5px; }
  }

</style>
</head>
<body>

  <!-- Slim identification bar -->
  <header class="topbar">
    <div class="topbar-left">
      <a href="adviser.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Back
      </a>
      <div class="topbar-divider"></div>
       <img src="../LOGO/logo0.1.png" alt="CapstoneHub logo" class="brand-mark">
      <p class="reviewing-label">Reviewing: <span id="reviewingFilename">Progress_Report_2.pdf</span></p>
    </div>
    <div class="user-avatar" title="Dr. Ramon Villanueva">RV</div>
  </header>

  <!-- Annotation toolbar -->
  <div class="toolbar">
    <div class="tool-group">
      <button class="tool-btn active" id="toolSelect" data-tool="select" title="Select">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path></svg>
      </button>
      <button class="tool-btn" id="toolPen" data-tool="pen" title="Pen">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
      </button>
      <button class="tool-btn" id="toolRectangle" data-tool="rectangle" title="Rectangle">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg>
      </button>
      <button class="tool-btn" id="toolCircle" data-tool="circle" title="Circle">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle></svg>
      </button>
      <button class="tool-btn" id="toolArrow" data-tool="arrow" title="Arrow">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"></line><polyline points="9 5 19 5 19 15"></polyline></svg>
      </button>
      <button class="tool-btn" id="toolText" data-tool="text" title="Add comment">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      </button>

      <button class="tool-btn" id="toolEraser" data-tool="eraser" title="Eraser (E) – click or drag over an annotation to remove it">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8.5l-4.8-4.8a1.5 1.5 0 0 1 0-2.1L13.1 3.7a1.5 1.5 0 0 1 2.1 0l5.1 5.1a1.5 1.5 0 0 1 0 2.1L11 20"></path><path d="M7 12l5 5"></path></svg>
      </button>

      <div class="toolbar-divider"></div>

      <div class="color-group" id="colorGroup">
        <button class="color-swatch active" style="background: var(--red);" data-color="#EA4335" title="Red"></button>
        <button class="color-swatch" style="background: var(--blue);" data-color="#4285F4" title="Blue"></button>
        <button class="color-swatch" style="background: var(--green);" data-color="#34A853" title="Green"></button>
        <button class="color-swatch" style="background: var(--yellow);" data-color="#FBBC05" title="Yellow"></button>
      </div>

      <div class="toolbar-divider"></div>

      <button class="tool-btn" id="undoBtn" title="Undo" disabled>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M3 13a9 9 0 1 0 3-7.7L3 7"></path></svg>
      </button>
      <button class="tool-btn" id="redoBtn" title="Redo" disabled>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"></path><path d="M21 13a9 9 0 1 1-3-7.7L21 7"></path></svg>
      </button>
    </div>

    <div class="toolbar-right">
      <div class="page-nav">
        <button class="tool-btn" id="prevPageBtn" title="Previous page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="page-nav-label" id="pageNavLabel">Page 1 of 3</span>
        <button class="tool-btn" id="nextPageBtn" title="Next page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
      <button class="btn btn-outline-red" id="requestRevisionBtn">Request Revision</button>
      <button class="btn btn-solid-green" id="approveBtn">Approve</button>
    </div>
  </div>

  <!-- Main area -->
  <div class="main-area">
    <div class="canvas-area" id="canvasArea">
      <div class="page-stage" id="pageStage">
        <canvas class="page-base" id="pageBaseCanvas" width="480" height="640"></canvas>
        <canvas class="page-annotation-canvas tool-select" id="annotationCanvas" width="480" height="640"></canvas>
      </div>
    </div>

    <aside class="review-sidebar">
      <div class="sidebar-section">
        <p class="sidebar-section-title">Pages</p>
        <div class="thumbnail-list" id="thumbnailList"></div>
      </div>
      <div class="sidebar-section">
        <p class="sidebar-section-title">Comments</p>
        <ul class="comments-list" id="commentsList"></ul>
        <p class="comments-empty hidden" id="commentsEmpty">No comments yet. Use the comment tool to flag something on the page.</p>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast"></div>

  <script>

    (function () {
      const PAGE_COUNT = 3;
      const HIT_TOLERANCE = 8;
      const pageBaseCanvas = document.getElementById('pageBaseCanvas');
      const annotationCanvas = document.getElementById('annotationCanvas');
      const baseCtx = pageBaseCanvas.getContext('2d');
      const annCtx = annotationCanvas.getContext('2d');

      let currentTool = 'select';
      let currentColor = '#EA4335';
      let currentPage = 0;

      // Per-page state: items = annotations; undo/redo hold JSON snapshots of items
      const pages = Array.from({ length: PAGE_COUNT }, function () {
        return { items: [], undoStack: [], redoStack: [] };
      });
      const page = function () { return pages[currentPage]; };

      /* ---------- Mock document page ---------- */
      function drawMockPage() {
        baseCtx.fillStyle = '#ffffff';
        baseCtx.fillRect(0, 0, pageBaseCanvas.width, pageBaseCanvas.height);
        baseCtx.fillStyle = '#e0e0e0';
        baseCtx.fillRect(40, 36, 240, 12);
        const lineWidths = [400, 380, 410, 360, 400, 300, 0, 390, 370, 405, 340, 0, 400, 380, 200];
        let y = 76;
        lineWidths.forEach(function (w) {
          if (w === 0) { y += 18; return; }
          baseCtx.fillRect(40, y, w, 8);
          y += 20;
        });
      }

      /* ---------- Rendering ---------- */
      function drawArrowHead(ctx, fromX, fromY, toX, toY) {
        const headLength = 10;
        const angle = Math.atan2(toY - fromY, toX - fromX);
        ctx.beginPath();
        ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headLength * Math.cos(angle - Math.PI / 6), toY - headLength * Math.sin(angle - Math.PI / 6));
        ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headLength * Math.cos(angle + Math.PI / 6), toY - headLength * Math.sin(angle + Math.PI / 6));
        ctx.stroke();
      }

      function drawItem(it, commentNumber) {
        annCtx.strokeStyle = it.color;
        annCtx.fillStyle = it.color;
        annCtx.lineWidth = 2.5;
        annCtx.lineCap = 'round';
        annCtx.lineJoin = 'round';

        if (it.type === 'pen') {
          annCtx.beginPath();
          annCtx.moveTo(it.points[0].x, it.points[0].y);
          if (it.points.length === 1) annCtx.lineTo(it.points[0].x + 0.01, it.points[0].y);
          it.points.forEach(function (p) { annCtx.lineTo(p.x, p.y); });
          annCtx.stroke();
        } else if (it.type === 'rectangle') {
          annCtx.strokeRect(it.x1, it.y1, it.x2 - it.x1, it.y2 - it.y1);
        } else if (it.type === 'circle') {
          annCtx.beginPath();
          annCtx.ellipse((it.x1 + it.x2) / 2, (it.y1 + it.y2) / 2,
                         Math.abs(it.x2 - it.x1) / 2, Math.abs(it.y2 - it.y1) / 2, 0, 0, Math.PI * 2);
          annCtx.stroke();
        } else if (it.type === 'arrow') {
          annCtx.beginPath();
          annCtx.moveTo(it.x1, it.y1);
          annCtx.lineTo(it.x2, it.y2);
          annCtx.stroke();
          drawArrowHead(annCtx, it.x1, it.y1, it.x2, it.y2);
        } else if (it.type === 'comment') {
          annCtx.beginPath();
          annCtx.arc(it.x, it.y, 10, 0, Math.PI * 2);
          annCtx.fill();
          annCtx.fillStyle = '#ffffff';
          annCtx.font = '600 11px Roboto, sans-serif';
          annCtx.textAlign = 'center';
          annCtx.textBaseline = 'middle';
          annCtx.fillText(String(commentNumber), it.x, it.y + 1);
        }
      }

      let draft = null; // item currently being drawn (preview)

      function render() {
        annCtx.clearRect(0, 0, annotationCanvas.width, annotationCanvas.height);
        let n = 0;
        page().items.forEach(function (it) {
          drawItem(it, it.type === 'comment' ? ++n : 0);
        });
        if (draft) drawItem(draft, 0);
      }

      function getComments(i) {
        return pages[i].items.filter(function (it) { return it.type === 'comment'; });
      }


      function snapshot() { return JSON.stringify(page().items); }

      function pushHistory(before) {
        const p = page();
        p.undoStack.push(before);
        if (p.undoStack.length > 50) p.undoStack.shift();
        p.redoStack = [];
        updateUndoRedoButtons();
      }

      function updateUndoRedoButtons() {
        document.getElementById('undoBtn').disabled = page().undoStack.length === 0;
        document.getElementById('redoBtn').disabled = page().redoStack.length === 0;
      }

      function refreshAll() {
        render();
        renderComments();
        updateThumbnails();
        updateUndoRedoButtons();
      }

      function undo() {
        const p = page();
        if (!p.undoStack.length) return;
        p.redoStack.push(snapshot());
        p.items = JSON.parse(p.undoStack.pop());
        refreshAll();
      }

      function redo() {
        const p = page();
        if (!p.redoStack.length) return;
        p.undoStack.push(snapshot());
        p.items = JSON.parse(p.redoStack.pop());
        refreshAll();
      }

      document.getElementById('undoBtn').addEventListener('click', undo);
      document.getElementById('redoBtn').addEventListener('click', redo);


      function loadPage(index) {
        currentPage = index;
        draft = null;
        document.getElementById('pageNavLabel').textContent = 'Page ' + (currentPage + 1) + ' of ' + PAGE_COUNT;
        refreshAll();
      }

      function goToPage(index) {
        if (index < 0 || index >= PAGE_COUNT) return;
        closeTextInputPopup();
        loadPage(index);
      }


      function updateThumbnails() {
        const list = document.getElementById('thumbnailList');
        list.innerHTML = '';
        for (let i = 0; i < PAGE_COUNT; i++) {
          const thumb = document.createElement('div');
          thumb.className = 'thumbnail' + (i === currentPage ? ' active' : '');
          thumb.textContent = 'Page ' + (i + 1);
          if (pages[i].items.length > 0) {
            const dot = document.createElement('span');
            dot.className = 'thumbnail-dot';
            thumb.appendChild(dot);
          }
          thumb.addEventListener('click', function () { goToPage(i); });
          list.appendChild(thumb);
        }
      }


      function renderComments() {
        const list = document.getElementById('commentsList');
        const empty = document.getElementById('commentsEmpty');
        list.innerHTML = '';
        const comments = getComments(currentPage);
        empty.classList.toggle('hidden', comments.length > 0);

        comments.forEach(function (comment, i) {
          const li = document.createElement('li');
          li.className = 'comment-item';

          const badge = document.createElement('span');
          badge.className = 'comment-badge';
          badge.textContent = i + 1;

          const wrap = document.createElement('div');
          wrap.className = 'comment-text-wrap';

          const text = document.createElement('p');
          text.className = 'comment-text';
          text.textContent = comment.text;

          const pageLabel = document.createElement('p');
          pageLabel.className = 'comment-page';
          pageLabel.textContent = 'Page ' + (currentPage + 1);

          wrap.appendChild(text);
          wrap.appendChild(pageLabel);
          li.appendChild(badge);
          li.appendChild(wrap);
          list.appendChild(li);
        });
      }


      const toolButtons = document.querySelectorAll('.tool-btn[data-tool]');
      function setTool(tool) {
        currentTool = tool;
        toolButtons.forEach(function (b) { b.classList.toggle('active', b.dataset.tool === tool); });
        annotationCanvas.className = 'page-annotation-canvas tool-' + tool;
        closeTextInputPopup();
      }
      toolButtons.forEach(function (btn) {
        btn.addEventListener('click', function () { setTool(btn.dataset.tool); });
      });

      const colorSwatches = document.querySelectorAll('.color-swatch');
      colorSwatches.forEach(function (swatch) {
        swatch.addEventListener('click', function () {
          colorSwatches.forEach(function (s) { s.classList.remove('active'); });
          swatch.classList.add('active');
          currentColor = swatch.dataset.color;
        });
      });


      function distToSegment(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1, dy = y2 - y1;
        const lenSq = dx * dx + dy * dy;
        let t = lenSq === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / lenSq;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
      }

      function hitTest(it, x, y) {
        const T = HIT_TOLERANCE;
        if (it.type === 'pen') {
          if (it.points.length === 1) return Math.hypot(x - it.points[0].x, y - it.points[0].y) <= T;
          for (let i = 1; i < it.points.length; i++) {
            const a = it.points[i - 1], b = it.points[i];
            if (distToSegment(x, y, a.x, a.y, b.x, b.y) <= T) return true;
          }
          return false;
        }
        if (it.type === 'rectangle') {
          return distToSegment(x, y, it.x1, it.y1, it.x2, it.y1) <= T ||
                 distToSegment(x, y, it.x2, it.y1, it.x2, it.y2) <= T ||
                 distToSegment(x, y, it.x2, it.y2, it.x1, it.y2) <= T ||
                 distToSegment(x, y, it.x1, it.y2, it.x1, it.y1) <= T;
        }
        if (it.type === 'circle') {
          const cx = (it.x1 + it.x2) / 2, cy = (it.y1 + it.y2) / 2;
          const rx = Math.max(Math.abs(it.x2 - it.x1) / 2, 1);
          const ry = Math.max(Math.abs(it.y2 - it.y1) / 2, 1);
          const d = Math.hypot((x - cx) / rx, (y - cy) / ry);
          return Math.abs(d - 1) * Math.min(rx, ry) <= T;
        }
        if (it.type === 'arrow') return distToSegment(x, y, it.x1, it.y1, it.x2, it.y2) <= T;
        if (it.type === 'comment') return Math.hypot(x - it.x, y - it.y) <= 12;
        return false;
      }

      // Remove the top-most annotation under the pointer. Returns true if something was removed.
      function eraseAt(x, y) {
        const items = page().items;
        for (let i = items.length - 1; i >= 0; i--) {
          if (hitTest(items[i], x, y)) {
            items.splice(i, 1);
            return true;
          }
        }
        return false;
      }

      /* ---------- Pointer handling ---------- */
      let isDrawing = false;
      let isErasing = false;
      let startX = 0, startY = 0;
      let historyBefore = null;

      function getCanvasPos(event) {
        const rect = annotationCanvas.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      }

      annotationCanvas.addEventListener('pointerdown', function (event) {
        if (currentTool === 'select') return;
        const pos = getCanvasPos(event);

        if (currentTool === 'text') {
          openTextInputPopup(pos);
          return;
        }

        annotationCanvas.setPointerCapture(event.pointerId);

        if (currentTool === 'eraser') {
          isErasing = true;
          historyBefore = snapshot();
          if (eraseAt(pos.x, pos.y)) { historyBefore = { snap: historyBefore, changed: true }; }
          else { historyBefore = { snap: historyBefore, changed: false }; }
          refreshAllNoHistory();
          return;
        }

        isDrawing = true;
        startX = pos.x;
        startY = pos.y;
        historyBefore = snapshot();

        if (currentTool === 'pen') {
          draft = { type: 'pen', color: currentColor, points: [{ x: pos.x, y: pos.y }] };
        } else {
          draft = { type: currentTool, color: currentColor, x1: startX, y1: startY, x2: startX, y2: startY };
        }
        render();
      });

      function refreshAllNoHistory() {
        render();
        renderComments();
        updateThumbnails();
      }

      annotationCanvas.addEventListener('pointermove', function (event) {
        const pos = getCanvasPos(event);

        if (isErasing) {
          if (eraseAt(pos.x, pos.y)) historyBefore.changed = true;
          refreshAllNoHistory();
          return;
        }

        if (!isDrawing || !draft) return;
        if (draft.type === 'pen') {
          draft.points.push({ x: pos.x, y: pos.y });
        } else {
          draft.x2 = pos.x;
          draft.y2 = pos.y;
        }
        render();
      });

      function finishPointer() {
        if (isErasing) {
          isErasing = false;
          if (historyBefore && historyBefore.changed) pushHistory(historyBefore.snap); // one undo step per erase drag
          historyBefore = null;
          refreshAll();
          return;
        }
        if (!isDrawing) return;
        isDrawing = false;
        if (draft) {
          page().items.push(draft);
          pushHistory(historyBefore);
        }
        draft = null;
        historyBefore = null;
        refreshAll();
      }

      annotationCanvas.addEventListener('pointerup', finishPointer);
      annotationCanvas.addEventListener('pointercancel', finishPointer);


      let activeTextPopup = null;

      function closeTextInputPopup() {
        if (activeTextPopup) {
          activeTextPopup.remove();
          activeTextPopup = null;
        }
      }

      function openTextInputPopup(pos) {
        closeTextInputPopup();

        const popup = document.createElement('div');
        popup.className = 'text-input-popup';
        popup.style.left = pos.x + 'px';
        popup.style.top = pos.y + 'px';

        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Add a comment...';

        const addBtn = document.createElement('button');
        addBtn.textContent = 'Add';

        function commit() {
          const text = input.value.trim();
          if (!text) { closeTextInputPopup(); return; }
          const before = snapshot();
          page().items.push({ type: 'comment', color: currentColor, x: pos.x, y: pos.y, text: text });
          pushHistory(before);
          closeTextInputPopup();
          refreshAll();
        }

        addBtn.addEventListener('click', commit);
        input.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') commit();
          if (event.key === 'Escape') closeTextInputPopup();
        });

        popup.appendChild(input);
        popup.appendChild(addBtn);
        document.getElementById('pageStage').appendChild(popup);
        activeTextPopup = popup;
        input.focus();
      }


      document.addEventListener('keydown', function (event) {
        if (event.target && event.target.tagName === 'INPUT') return;
        const mod = event.ctrlKey || event.metaKey;
        const key = event.key.toLowerCase();
        if (mod && key === 'z' && !event.shiftKey) { event.preventDefault(); undo(); }
        else if (mod && (key === 'y' || (key === 'z' && event.shiftKey))) { event.preventDefault(); redo(); }
        else if (!mod && key === 'e') { setTool('eraser'); }
      });


      document.getElementById('prevPageBtn').addEventListener('click', function () { goToPage(currentPage - 1); });
      document.getElementById('nextPageBtn').addEventListener('click', function () { goToPage(currentPage + 1); });


      const toast = document.getElementById('toast');
      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('visible');
        setTimeout(function () { toast.classList.remove('visible'); }, 1400);
      }

      function finishReview(message) {
        showToast(message);
        setTimeout(function () { window.location.href = 'adviser.html'; }, 1000);
      }

      document.getElementById('approveBtn').addEventListener('click', function () { finishReview('Marked as approved'); });
      document.getElementById('requestRevisionBtn').addEventListener('click', function () { finishReview('Revision requested'); });


      const params = new URLSearchParams(window.location.search);
      const fileParam = params.get('file');
      if (fileParam) document.getElementById('reviewingFilename').textContent = fileParam;

      drawMockPage();
      loadPage(0);
    })();
  </script>

</body>
</html>
